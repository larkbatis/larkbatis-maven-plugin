# The plugin's own published version. The release workflow overrides it with
# `-Pversion=<tag without the leading v>`.
version=0.1.0-SNAPSHOT

# The lightbatis core version this plugin injects into consumer builds
# (lightbatis-processor on annotationProcessorPaths). Deliberately a separate
# knob: a plugin-only fix release must not bump the coordinate consumers
# resolve, and a core release that does not touch the plugin must be adoptable
# by bumping one line here.
lightbatisCoreVersion=0.1.0-SNAPSHOT
